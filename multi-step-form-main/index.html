<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="bg-white p-4 rounded-xl shadow-lg flex flex-col md:flex-row w-full max-w-4xl">
  <aside class="bg-blue-700 p-8 rounded-lg md:w-1/3 text-white space-y-6">
    <div class="flex items-center gap-4">
      <span class="step-num active border border-white rounded-full w-8 h-8 flex items-center justify-center">1</span>
      <div><p class="text-xs text-blue-200 uppercase">Step 1</p><p class="font-bold uppercase">Your Info</p></div>
    </div>
    </aside>

  <main class="p-8 md:w-2/3 relative">
    <form id="multiStepForm">
      <section data-step="1">
        <h1 class="text-2xl font-bold text-blue-900">Personal info</h1>
        <p class="text-gray-400 mb-6">Please provide your name, email address, and phone number.</p>
        <div class="space-y-4">
          <div>
            <label class="block text-blue-900 text-sm mb-1">Name</label>
            <input type="text" placeholder="e.g. Stephen King" class="w-full border rounded p-2 outline-blue-500" required>
          </div>
          </div>
      </section>

      <section data-step="3" class="hidden">
        <h1 class="text-2xl font-bold text-blue-900">Pick add-ons</h1>
        <p class="text-gray-400 mb-6">Add-ons help enhance your gaming experience.</p>
        <div class="space-y-3">
          <label class="flex items-center justify-between p-4 border rounded-lg hover:border-blue-700 cursor-pointer">
            <div class="flex items-center gap-4">
              <input type="checkbox" class="w-5 h-5 accent-blue-700" data-price="10">
              <div>
                <p class="font-bold text-blue-900">Online service</p>
                <p class="text-xs text-gray-400">Access to multiplayer games</p>
              </div>
            </div>
            <p class="text-blue-700">+$10/yr</p>
          </label>
          </div>
      </section>

      <div class="mt-12 flex justify-between items-center">
        <button type="button" id="prevBtn" class="text-gray-400 font-medium invisible">Go Back</button>
        <button type="button" id="nextBtn" class="bg-blue-900 text-white px-6 py-2 rounded-lg">Next Step</button>
      </div>
    </form>
  </main>
</div>
</body>
</html>
